name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare complete offline lesson and game data
        run: python3 tools/prepare_data.py
      - name: Verify offline content
        run: |
          test -s app/src/main/assets/lessons.tsv
          test -s app/src/main/assets/games.tsv
          echo "Lessons: $(wc -l < app/src/main/assets/lessons.tsv)"
          echo "Games: $(wc -l < app/src/main/assets/games.tsv)"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Locate APK
        run: find app/build/outputs -type f -name '*.apk' -print
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Little-English-Friends-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
