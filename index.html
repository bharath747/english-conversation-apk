<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
<title>Little English Friends</title>
</head>
<body>
<main class="app">
<header><div class="brand">🌈 <span>Little English Friends</span></div><div class="stars">⭐ <b id="stars">0</b></div></header>
<section id="home" class="screen active">
  <div class="hero"><div class="mascot">🦊</div><div><h1>Hello, Friend!</h1><p>Let's talk, listen and learn English together.</p></div></div>
  <div class="grid">
    <button class="card" data-action="lesson" data-topic="Greetings">👋<strong>Greetings</strong><small>Hello and goodbye</small></button>
    <button class="card" data-action="lesson" data-topic="Family">👨‍👩‍👧<strong>My Family</strong><small>Talk about family</small></button>
    <button class="card" data-action="lesson" data-topic="School">🎒<strong>At School</strong><small>Friends and class</small></button>
    <button class="card" data-action="lesson" data-topic="Food">🍎<strong>Food Time</strong><small>Yummy words</small></button>
  </div>
  <button class="big" id="practiceBtn">🎤 Practice a Conversation</button>
</section>
<section id="lesson" class="screen">
  <button class="back">← Back</button><div id="lessonContent"></div>
</section>
<section id="practice" class="screen">
  <button class="back">← Back</button><h2>🎤 Say it with me!</h2><div class="practiceBox"><div id="prompt" class="prompt"></div><button id="listenBtn" class="listen">🔊 Listen</button><button id="nextBtn" class="big">Next sentence ➜</button></div><p class="tip">Speak aloud after listening. Your brave voice is the most important thing!</p>
</section>
</main><script src="app.js"></script>
</body></html>
